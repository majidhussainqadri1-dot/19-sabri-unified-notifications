name: Materialize File 19 source

on:
  push:
    branches:
      - file-19-complete-2.0.0
    paths:
      - '.bootstrap/**'
      - '.github/workflows/materialize-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: file-19-complete-2.0.0
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.tar.gz.b64.part* | base64 --decode > /tmp/file19-source.tar.gz
          echo '9b3e4396924e946c5f77bddc7f2b27805f364c9b5c036dfa1fd9143bb0fb0d36  /tmp/file19-source.tar.gz' | sha256sum --check --strict

      - name: Materialize complete source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/file19-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Complete File 19 unified notifications runtime 2.0.0'
          git push origin HEAD:file-19-complete-2.0.0
