name: File 19 Quality

on:
  push:
    branches: [ main, 'file-19-*', 'file19-*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic baseline unit assertions
        run: php tests/unit.php
      - name: Intelligent Attention 3.0 assertions
        run: php tests/advanced-unit.php
      - name: TextBee SMS provider assertions
        run: php tests/textbee-provider.php
      - name: File 19 3.0.1 static and security regression audit
        run: bash tests/static-audit.sh
      - name: Clean-extract deterministic package audit
        run: bash tests/package-audit.sh
      - name: Verify deterministic rebuild and capture/freeze checksum
        run: |
          first="$(sha256sum build/19-sabri-unified-notifications-3.0.1.zip | awk '{print $1}')"
          bash tools/build-release.sh >/tmp/sun-rebuild.log
          second="$(sha256sum build/19-sabri-unified-notifications-3.0.1.zip | awk '{print $1}')"
          test "$first" = "$second"
          expected="$(awk '{print $1}' RELEASE-SHA256.txt)"
          if [ "$expected" != "PENDING" ]; then test "$second" = "$expected"; fi
          grep -q '19-sabri-unified-notifications-3.0.1.zip' RELEASE-SHA256.txt
          echo "FILE19_3_0_1_SHA256=$second"
          cat build/19-sabri-unified-notifications-3.0.1.zip.sha256
      - name: Upload release candidate
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: file-19-notifications-3.0.1
          path: |
            build/19-sabri-unified-notifications-3.0.1.zip
            build/19-sabri-unified-notifications-3.0.1.zip.sha256
          if-no-files-found: error
