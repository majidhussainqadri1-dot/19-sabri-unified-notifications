name: File 19 Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "baseline/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality and CF-01 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run inherited and CF-01 quality gates
        run: |
          set -euo pipefail
          bash tests/static-audit.sh
          php tests/unit-lite.php
          git diff --check
