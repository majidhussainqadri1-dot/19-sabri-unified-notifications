name: File 19 Quality

on:
  push:
    branches: [ main, 'file-19-*', 'file19-*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V12.3 dynamic localized UI and safe-link regressions
        run: node tests/v123-localization-ui.test.cjs
      - name: Deterministic baseline unit assertions
        run: php tests/unit.php
      - name: Intelligent Attention 3.0 assertions
        run: php tests/advanced-unit.php
      - name: Completeness audit regression assertions
        run: php tests/completeness-regression.php
      - name: TextBee SMS provider assertions
        run: php tests/textbee-provider.php
      - name: Privacy and provider receipt functional regressions
        run: php tests/privacy-provider-regression.php
      - name: TextBee failed-response functional regressions
        run: php tests/textbee-failure-regression.php
      - name: V12.3 81-ID evidence-first acceptance inventory
        run: php tests/v123-acceptance-inventory.php
      - name: V12.1 File 19 all 81 requirement identifiers
        run: php tests/requirements-catalogue-81.php
      - name: Safe Mode and File 01 registry contract regressions
        run: php tests/containment-registry-regression.php
      - name: File 19 3.0.8 static and security regression audit
        run: bash tests/static-audit.sh
      - name: Clean-extract deterministic package audit
        run: bash tests/package-audit.sh
      - name: Verify deterministic rebuild and capture/freeze checksum
        run: |
          first="$(sha256sum build/19-sabri-unified-notifications-3.0.8.zip | awk '{print $1}')"
          bash tools/build-release.sh >/tmp/sun-rebuild.log
          second="$(sha256sum build/19-sabri-unified-notifications-3.0.8.zip | awk '{print $1}')"
          test "$first" = "$second"
          expected="$(awk '{print $1}' RELEASE-SHA256.txt)"
          if [ "$expected" != "PENDING" ]; then test "$second" = "$expected"; fi
          grep -q '19-sabri-unified-notifications-3.0.8.zip' RELEASE-SHA256.txt
          echo "FILE19_3_0_8_SHA256=$second"
          cat build/19-sabri-unified-notifications-3.0.8.zip.sha256
      - name: File 19 read-only deployed-reality collector syntax and safe boundaries
        run: |
          bash -n tools/file19-readonly-live-freeze.sh
          grep -Fq 'mktemp /tmp/file19-readonly-evidence-' tools/file19-readonly-live-freeze.sh
          grep -Fq -- '--skip-plugins --skip-themes' tools/file19-readonly-live-freeze.sh
          grep -Fq 'SHOW COLUMNS FROM' tools/file19-readonly-live-freeze.sh
          grep -Fq 'MANIFEST.sha256' tools/file19-readonly-live-freeze.sh
      - name: Record exact-head source checksums (excluding self-reference)
        run: |
          find . -type f ! -path './.git/*' ! -path './build/*' ! -name SOURCE-CHECKSUMS.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/file19-source-checksums.txt
          mkdir -p build
          cp /tmp/file19-source-checksums.txt build/SOURCE-CHECKSUMS-3.0.8.sha256
          cat /tmp/file19-source-checksums.txt
          cmp -s SOURCE-CHECKSUMS.sha256 /tmp/file19-source-checksums.txt || { echo 'Exact-head source digest manifest mismatch' >&2; exit 1; }
      - name: Upload release candidate
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: file-19-notifications-3.0.8
          path: |
            build/19-sabri-unified-notifications-3.0.8.zip
            build/19-sabri-unified-notifications-3.0.8.zip.sha256
            build/SOURCE-CHECKSUMS-3.0.8.sha256
          if-no-files-found: error
