name: File 19 Release Evidence 2.3

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  exact-head-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit, static and package gates
        run: |
          php tests/unit.php
          bash tests/static-audit.sh
          bash tests/package-audit.sh
      - name: Reproducibility gate
        id: release
        shell: bash
        run: |
          ZIP=build/19-sabri-unified-notifications-2.3.0.zip
          first="$(sha256sum "$ZIP" | awk '{print $1}')"
          bash tools/build-release.sh >/tmp/sun-rebuild.log
          second="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$first" = "$second"
          echo "sha256=$second" >> "$GITHUB_OUTPUT"
          echo "entries=$(unzip -Z1 "$ZIP" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "unit_summary=$(php tests/unit.php | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Upload exact release artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-19-notifications-2.3.0-exact-head
          path: |
            build/19-sabri-unified-notifications-2.3.0.zip
            build/19-sabri-unified-notifications-2.3.0.zip.sha256
          if-no-files-found: error
      - name: Record immutable PR evidence
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- FILE19-2.3.0-EXACT-HEAD-EVIDENCE -->';
            const body = `${marker}\n## File 19 — 2.3.0 exact-head release evidence\n\n- Head: \`${context.payload.pull_request.head.sha}\`\n- Plugin ZIP SHA-256: \`${{ steps.release.outputs.sha256 }}\`\n- ZIP entries: **${{ steps.release.outputs.entries }}**\n- Unit result: **${{ steps.release.outputs.unit_summary }}**\n- Static audit: **PASS**\n- Canonical clean-extract package audit: **PASS**\n- Deterministic rebuild: **PASS**\n\nThis proves source/package/Automated-QA evidence only. Hostinger staging, live and operational acceptance remain separate gates.`;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
