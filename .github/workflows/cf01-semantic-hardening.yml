name: One-time CF-01 Semantic Hardening

on:
  push:
    branches:
      - codex/file19-cf01-clinical-notifications-1.1.1

permissions:
  contents: write

jobs:
  semantic-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file19-cf01-clinical-notifications-1.1.1
          fetch-depth: 0
      - name: Apply exact UTC and suppression corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sabri-unified-notifications/includes/class-sun-cf01-clinical-notifications.php')
          source = path.read_text(encoding='utf-8')
          old_recipient = """        if ($user_id <= 0 || !get_userdata($user_id)) {
                      return self::error('sun_cf01_recipient_unavailable', 'The clinical notification recipient is unavailable.', 404);
                  }
          
                  $priority = self::priority($urgency, $template_mandatory);
          """
          new_recipient = """        if ($user_id <= 0 || !get_userdata($user_id)) {
                      return self::error('sun_cf01_recipient_unavailable', 'The clinical notification recipient is unavailable.', 404);
                  }
          
                  $preferences = SUN_Core::get_preferences($user_id);
                  if (!$template_mandatory && empty($preferences['categories'][(string) $template['category']])) {
                      return new WP_Error(
                          'sun_cf01_notification_suppressed',
                          'The recipient has disabled this routine notification category.',
                          ['status' => 202, 'suppressed' => true, 'retryable' => false]
                      );
                  }
          
                  $priority = self::priority($urgency, $template_mandatory);
          """
          old_expiry = """        if (strlen($value) > 40 || preg_match('/^\\d{4}-\\d{2}-\\d{2}[T ][0-2]\\d:[0-5]\\d:[0-5]\\d(?:Z| ?UTC)?$/', trim($value)) !== 1) {
                      return '';
                  }
                  $timestamp = strtotime($value);
          """
          new_expiry = """        $value = trim($value);
                  if (strlen($value) > 40
                      || preg_match('/^\\d{4}-\\d{2}-\\d{2}(?:T(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\dZ| (?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d UTC)$/', $value) !== 1) {
                      return '';
                  }
                  $normalized = str_ends_with($value, 'Z') ? substr($value, 0, -1) . ' UTC' : $value;
                  $timestamp = strtotime($normalized);
          """
          if old_recipient not in source:
              raise SystemExit('Expected recipient block not found exactly.')
          if old_expiry not in source:
              raise SystemExit('Expected expiry block not found exactly.')
          source = source.replace(old_recipient, new_recipient, 1).replace(old_expiry, new_expiry, 1)
          path.write_text(source, encoding='utf-8')
          PY
          php -l sabri-unified-notifications/includes/class-sun-cf01-clinical-notifications.php
          git diff --check
      - name: Commit exact semantic corrections
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-unified-notifications/includes/class-sun-cf01-clinical-notifications.php
          git commit -m 'Make CF-01 expiry UTC-only and suppression non-retryable'
          git push origin HEAD:codex/file19-cf01-clinical-notifications-1.1.1
