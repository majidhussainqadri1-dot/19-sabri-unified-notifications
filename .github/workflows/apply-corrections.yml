name: Apply File 19 corrective source

on:
  push:
    branches:
      - fix/file-19-security-privacy-release

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: fix/file-19-security-privacy-release
          fetch-depth: 0

      - name: Verify corrective bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f file19-corrective-tree.zip
          echo "2217f3585e9bd61cd9501a158b49f4fb1677364e2d2705851e6f6f400af952d6  file19-corrective-tree.zip" | sha256sum --check --strict
          unzip -t file19-corrective-tree.zip

      - name: Apply corrected repository tree
        shell: bash
        run: |
          set -euo pipefail
          unzip -o file19-corrective-tree.zip -d .
          rm -f file19-corrective-tree.zip .github/workflows/apply-corrections.yml
          chmod +x tests/static-audit.sh

      - name: Run corrective quality gates
        shell: bash
        run: |
          set -euo pipefail
          find sabri-unified-notifications -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check sabri-unified-notifications/assets/js/sun.js
          bash tests/static-audit.sh
          php tests/unit-lite.php

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sabri Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix File 19 security, privacy, delivery, and integration defects"
          git push origin HEAD:fix/file-19-security-privacy-release
