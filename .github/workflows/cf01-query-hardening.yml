name: One-time CF-01 Destination Query Hardening

on:
  push:
    branches:
      - codex/file19-cf01-clinical-notifications-1.1.1

permissions:
  contents: write

jobs:
  harden-query-validation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file19-cf01-clinical-notifications-1.1.1
          fetch-depth: 0
      - name: Replace exact vulnerable query-key block
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sabri-unified-notifications/includes/class-sun-cf01-clinical-notifications.php')
          source = path.read_text(encoding='utf-8')
          old = """        $query = (string) ($parts['query'] ?? '');
                  if ($query !== '' && preg_match('/(?:^|&)(?:token|auth|authorization|signature|sig|key|secret|password|session)=/i', $query)) {
                      return false;
                  }
          """
          new = """        $query = (string) ($parts['query'] ?? '');
                  if ($query !== '') {
                      parse_str($query, $query_values);
                      $stack = [is_array($query_values) ? $query_values : []];
                      while ($stack !== []) {
                          $values = array_pop($stack);
                          foreach ($values as $key => $value) {
                              $key = strtolower((string) $key);
                              if (preg_match('/(?:token|authorization|auth|bearer|signature|signed|secret|password|session|api[_-]?key|access[_-]?key)/i', $key)) {
                                  return false;
                              }
                              if (is_array($value)) {
                                  $stack[] = $value;
                                  continue;
                              }
                              $value = (string) $value;
                              if (stripos($value, 'bearer ') !== false
                                  || preg_match('/^[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}$/', $value)) {
                                  return false;
                              }
                          }
                      }
                  }
          """
          if old not in source:
              raise SystemExit('Expected vulnerable query-validation block was not found exactly.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          php -l sabri-unified-notifications/includes/class-sun-cf01-clinical-notifications.php
          git diff --check
      - name: Commit exact security correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-unified-notifications/includes/class-sun-cf01-clinical-notifications.php
          git commit -m 'Reject compound bearer query keys in CF-01 destinations'
          git push origin HEAD:codex/file19-cf01-clinical-notifications-1.1.1
